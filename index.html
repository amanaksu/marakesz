<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#163b3d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="direction-indicator.css" />
  <title>마라케시 · 카펫 시장</title>
</head>
<body>
  <main class="app">
    <header>
      <div><p class="eyebrow">MARRAKECH · LOCAL EDITION</p><h1>마라케시 <span>카펫 시장</span></h1></div>
      <button class="icon-btn" id="helpBtn" aria-label="규칙 보기">?</button>
    </header>
    <section class="setup card" id="setup">
      <div><p class="eyebrow">새 게임</p><h2>시장에 들어갈 상인을 고르세요</h2></div>
      <div class="setup-controls">
        <label>플레이어 <select id="playerCount"><option value="2">2명</option><option value="3" selected>3명</option><option value="4">4명</option></select></label>
        <label class="ai-toggle"><input id="aiEnabled" type="checkbox" /> 파랑을 AI로</label>
        <button class="primary" id="startBtn">게임 시작 <span>→</span></button>
      </div>
      <p class="hint">한 기기를 돌려가며 플레이합니다. iPad와 Windows 브라우저에 맞춰 설계되었습니다.</p>
    </section>
    <section class="game hidden" id="game">
      <aside class="players card" id="players"></aside>
      <section class="table">
        <div class="turnbar card"><div id="turnTitle">준비 중</div><div class="phase" id="phaseText">—</div></div>
        <div class="board-wrap"><div class="board" id="board" aria-label="7 x 7 시장 보드"></div></div>
        <section class="actions card" id="actions"></section>
      </section>
      <aside class="log card"><p class="eyebrow">시장 소식</p><div id="events" aria-live="polite"></div></aside>
    </section>
  </main>
  <dialog id="modal"><button class="close" id="closeModal">×</button><div id="modalContent"></div></dialog>
  <script src="game.js"></script>
  <script src="edge-turn-guides.js"></script>
  <script src="rule-overrides.js"></script>
  <script src="two-step-placement.js"></script>
</body>
</html>
